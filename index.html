<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30 Ngày Sài Gòn</title>
<meta name="description" content="Game mô phỏng chi tiêu có cốt truyện: giúp tân sinh viên Minh vừa học vừa làm thêm, sống qua tháng đầu tiên ở Sài Gòn.">
<meta name="theme-color" content="#0b0c16">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=VT323&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="screen">
  <div class="stage" id="stage">
    <canvas id="scene" width="320" height="180" role="img" aria-label="Khung cảnh địa điểm hiện tại"></canvas>

    <div class="ui" id="ui" hidden>
      <div class="hudc glass">
        <div class="dayrow"><span class="lbl">Ngày</span><span class="num big" id="dayNum">1</span><span class="num of">/30</span><span class="dow" id="dow"></span></div>
        <ol class="slots" id="slots" aria-label="Buổi trong ngày"></ol>
        <div class="mstats" id="mstats"></div>
      </div>
      <div class="plaque" id="plaque"><b id="placeName"></b><small id="placeSub"></small><span id="placeShut"></span></div>
      <div class="wallet glass"><span class="coin" data-ico="coin"></span><div style="min-width:0"><span class="num money" id="money"></span><span class="ledger" id="ledger"></span></div></div>
      <button class="tracker glass" id="tracker" type="button" title="Mở danh sách nhiệm vụ (phím J)"></button>

      <div class="cmd-wrap" id="cmdWrap">
        <div class="pop-menu" id="popMenu" hidden></div>
        <div class="cmd-note" id="cmdNote" hidden></div>
        <div class="cmdbar glass" id="cmdbar" role="toolbar" aria-label="Hành động"></div>
      </div>

      <nav class="tools" aria-label="Công cụ">
        <button class="tool" type="button" data-open="bag" title="Túi đồ (phím B)"><span data-ico="bag"></span><span class="tn">Túi đồ</span><span class="badge" id="bagBadge" hidden></span></button>
        <button class="tool" type="button" data-open="cal" title="Lịch tháng (phím L)"><span data-ico="cal"></span><span class="tn">Lịch</span><span class="badge dot" id="calBadge" hidden></span></button>
        <button class="tool" type="button" data-open="tasks" title="Nhiệm vụ (phím J)"><span data-ico="scroll"></span><span class="tn">Nhiệm vụ</span><span class="badge" id="taskBadge" hidden></span></button>
        <button class="tool" type="button" data-open="log" title="Nhật ký (phím N)"><span data-ico="book"></span><span class="tn">Nhật ký</span></button>
        <button class="tool" type="button" data-open="rules" title="Luật chơi"><span data-ico="help"></span><span class="tn">Luật</span></button>
      </nav>
      <button class="mapbtn" type="button" data-open="map" title="Bản đồ (phím M)"><span data-ico="pin"></span>Bản đồ</button>
      <div class="toast out" id="toast" role="status"></div>
    </div>

    <div class="fx" id="fx"></div>

    <div class="title-screen" id="titleScreen">
      <div class="title-box">
        <p class="eyebrow">Tháng đầu tiên của tân sinh viên</p>
        <h1><span class="num">30</span>Ngày<br>Sài Gòn</h1>
        <p class="tagline">Minh, 18 tuổi, rời Tuy Hòa vào Sài Gòn học năm nhất. Bố mẹ gửi 3 triệu cho tháng đầu, phần còn lại Minh phải tự lo bằng việc làm thêm.</p>
        <div class="title-btns" id="titleBtns"></div>
      </div>
    </div>

    <div class="layer" id="layer" hidden><div class="win" id="win" role="dialog" aria-modal="true"></div></div>
  </div>
</div>

<script src="src/gfx/core.js"></script>
<script src="src/gfx/characters.js"></script>
<script src="src/gfx/portraits.js"></script>
<script src="src/gfx/icons.js"></script>
<script src="src/game.js"></script>
</body>
</html>
