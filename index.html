<!doctype html>
<html lang="vi">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>30 Ngày Sài Gòn</title>
<meta name="description" content="Game mô phỏng chi tiêu có cốt truyện: giúp tân sinh viên Minh vừa học vừa làm thêm, sống qua tháng đầu tiên ở Sài Gòn.">
<meta name="theme-color" content="#0b0c16">
<link rel="icon" href="assets/favicon.svg" type="image/svg+xml">
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Be+Vietnam+Pro:wght@400;500;600;700;800;900&family=VT323&display=swap">
<link rel="stylesheet" href="src/style.css">
</head>
<body>
<div class="screen">
  <div class="stage" id="stage">
    <canvas id="scene" width="320" height="180" role="img" aria-label="Khung cảnh địa điểm hiện tại"></canvas>

    <div class="ui" id="ui" hidden>
      <div class="pn clock" aria-label="Thời gian và địa điểm">
        <div class="r1"><span id="dow"></span><b id="chap"></b></div>
        <div class="r2"><span class="w">Ngày</span><span class="num d" id="dayNum">1</span><span class="num of">/30</span></div>
        <div class="slots well" id="slots" aria-label="Buổi trong ngày"></div>
        <div class="where"><i class="ic" data-ic="pin"></i><div><span id="placeName"></span><small id="placeSub"></small><span id="placeShut"></span></div></div>
        <div class="room" id="roomState" data-l="0" title="Độ bừa bộn của phòng" hidden><span class="rl">Phòng</span><b id="roomName"></b><span class="pips" aria-hidden="true"><i></i><i></i><i></i></span></div>
      </div>
      <div class="pn wallet"><i class="ic" data-ic="coin"></i><div><div class="num m" id="money"></div><div class="sub" id="ledger"></div></div></div>
      <button class="pn quest" type="button" id="tracker" data-tip="Mở Nhiệm vụ (J)"></button>
      <div class="pn stats" id="mstats" aria-label="Chỉ số"></div>
      <div class="pn note" id="cmdNote" role="status" hidden><i class="ic" data-ic="warn"></i><span id="noteT"></span><button type="button" id="noteBtn"></button></div>
      <div class="pn amenu" id="popMenu" hidden role="dialog" aria-modal="false" aria-labelledby="popT"></div>
      <nav class="pn hotbar" id="cmdbar" aria-label="Thanh lệnh"></nav>
      <div class="pn toast out" id="toast" role="status"></div>
    </div>

    <div class="fx" id="fx"></div>

    <div class="title-screen" id="titleScreen">
      <div class="title-box">
        <p class="eyebrow">Tháng đầu tiên của tân sinh viên</p>
        <h1><span class="num">30</span>Ngày<br>Sài Gòn</h1>
        <p class="tagline">Minh, 18 tuổi, rời Tuy Hòa vào Sài Gòn học năm nhất. Bố mẹ gửi 3 triệu cho tháng đầu, phần còn lại Minh phải tự lo bằng việc làm thêm.</p>
        <div class="title-btns" id="titleBtns"></div>
      </div>
    </div>

    <div class="layer" id="layer" hidden><div class="win" id="win" role="dialog" aria-modal="true"></div></div>
  </div>
</div>

<script src="src/gfx/core.js"></script>
<script src="src/gfx/characters.js"></script>
<script src="src/gfx/portraits.js"></script>
<script src="src/gfx/icons.js"></script>
<script src="src/gfx/scenes/room.js"></script>
<script src="src/gfx/scenes/school.js"></script>
<script src="src/gfx/scenes/store.js"></script>
<script src="src/gfx/scenes/food.js"></script>
<script src="src/gfx/scenes/rest.js"></script>
<script src="src/game.js"></script>
</body>
</html>
